name: Ra Pulse Vigilance
on:
  schedule:
    - cron: '0 * * * *' # Vigilancia horaria
  workflow_dispatch:      # Ejecución manual (para pruebas)

jobs:
  run-vigilance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Execute Pulse Core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/gerrit-fetch.js
          node scripts/analyzer.js
          
